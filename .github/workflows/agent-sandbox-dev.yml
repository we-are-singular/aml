name: Agent Sandbox Dev

on:
  push:
    branches: [main]
    paths:
      - "images/aml-agent-sandbox/**"
      - ".github/workflows/agent-sandbox-dev.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: agent-sandbox-dev
  cancel-in-progress: true

env:
  DEV_IMAGE: ghcr.io/we-are-singular/aml-agent-sandbox:dev
  LOCAL_IMAGE: aml-agent-sandbox:ci

jobs:
  publish:
    name: Build and publish / linux-amd64
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: images/aml-agent-sandbox
          load: true
          platforms: linux/amd64
          tags: ${{ env.LOCAL_IMAGE }}
          build-args: |
            IMAGE_VERSION=dev
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image contract
        working-directory: images/aml-agent-sandbox
        env:
          AML_AGENT_SANDBOX_IMAGE: ${{ env.LOCAL_IMAGE }}
        run: npm run check

      - name: Audit image dependencies
        working-directory: images/aml-agent-sandbox
        run: npm audit --omit=dev

      # Registry credentials are introduced only after the build and conformance
      # checks. They are never available to the Dockerfile or its build arguments.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish dev image
        run: |
          docker tag "$LOCAL_IMAGE" "$DEV_IMAGE"
          docker push "$DEV_IMAGE"
