name: Agent Sandbox Dev

on:
  push:
    branches: [main]
    paths:
      - "images/sandbox/**"
      - ".github/workflows/agent-sandbox-dev.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: agent-sandbox-dev
  cancel-in-progress: true

env:
  DEV_IMAGE: ghcr.io/we-are-singular/aml-agent-sandbox:dev
  LOCAL_IMAGE: aml-agent-sandbox:ci

jobs:
  security:
    name: Security audit
    permissions:
      contents: read
    uses: ./.github/workflows/security-audit.yml

  publish:
    name: Build and publish / linux-amd64
    needs: security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: images/sandbox
          load: true
          platforms: linux/amd64
          tags: ${{ env.LOCAL_IMAGE }}
          build-args: |
            IMAGE_VARIANT=full
            IMAGE_VERSION=dev
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke image
        working-directory: images/sandbox
        env:
          AML_AGENT_SANDBOX_IMAGE: ${{ env.LOCAL_IMAGE }}
        run: npm run check

      # Registry credentials are introduced only after the build and smoke check.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish dev image
        run: |
          docker tag "$LOCAL_IMAGE" "$DEV_IMAGE"
          docker push "$DEV_IMAGE"
