name: CLI portability

on:
  push:
    branches: [main]
    paths:
      - apps/cli/**
      - sdk/src/**
      - sdk/package.json
      - sdk/vite.config.ts
      - sdk/tsconfig.json
      - sdk/tsconfig.build.json
      - providers/**/src/**
      - providers/**/package.json
      - .nvmrc
      - tsconfig.json
      - .github/workflows/cli-portability.yml
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - apps/cli/**
      - sdk/src/**
      - sdk/package.json
      - sdk/vite.config.ts
      - sdk/tsconfig.json
      - sdk/tsconfig.build.json
      - providers/**/src/**
      - providers/**/package.json
      - .nvmrc
      - tsconfig.json
      - .github/workflows/cli-portability.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: CLI / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up npm
        run: npm install --global npm@11.18.0

      - name: Install dependencies
        run: npm ci --prefer-offline --include=optional

      - name: Build SDK dependency
        run: npm run build --workspace=@aml-jsx/sdk

      - name: Test compiled CLI
        run: npm run test --workspace=@aml-jsx/cli

      - name: Check packed CLI
        run: npm run package:check --workspace=@aml-jsx/cli
