name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect portability changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      portability: ${{ steps.filter.outputs.portability }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Detect portability changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            portability:
              - 'apps/cli/**'
              - 'sdk/src/**'
              - 'sdk/package.json'
              - 'sdk/vite.config.ts'
              - 'sdk/tsconfig.json'
              - 'sdk/tsconfig.build.json'
              - 'providers/**/src/**'
              - 'providers/**/package.json'
              - 'providers/**/vite.config.ts'
              - 'providers/**/tsconfig.json'
              - 'providers/**/tsconfig.build.json'
              - 'config/**'
              - 'package.json'
              - 'package-lock.json'
              - 'turbo.json'
              - 'tsconfig.json'
              - '.nvmrc'
              - '.github/workflows/ci.yml'

  quality:
    name: Quality / Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up npm
        run: |
          npm install --global npm@11.19.0
          test "$(npm --version)" = "11.19.0"

      - name: Install dependencies
        run: npm ci --prefer-offline --include=optional

      - name: Check formatting
        run: npm run format:check

      - name: Lint and type-check
        run: npm run lint -- --force

      - name: Test
        run: npm run test -- --force

      - name: Build
        run: npm run build -- --force
        env:
          SITE_BASE: /
          SITE_URL: https://agent-markup-language.com

      - name: Check packages
        run: npm run pack:check

      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - name: Upload website artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/website/dist
          include-hidden-files: true

  portability:
    name: CLI / ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.portability == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up npm
        # PowerShell cannot run the POSIX npm version assertion; Git Bash is preinstalled on windows-latest.
        shell: bash
        run: |
          npm install --global npm@11.19.0
          command -v npm
          npm ls -g npm --json
          test "$(npm --version)" = "11.19.0"

      - name: Install dependencies
        run: npm ci --prefer-offline --include=optional

      - name: Build SDK dependency
        run: npm run build --workspace=@aml-jsx/sdk

      - name: Test compiled CLI
        run: npm run test --workspace=@aml-jsx/cli

      - name: Check packed CLI
        run: npm run package:check --workspace=@aml-jsx/cli

  gate:
    name: CI
    needs: [changes, quality, portability]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      QUALITY_RESULT: ${{ needs.quality.result }}
      PORTABILITY_RESULT: ${{ needs.portability.result }}
    steps:
      - name: Verify applicable checks
        run: |
          test "$CHANGES_RESULT" = success
          test "$QUALITY_RESULT" = success
          test "$PORTABILITY_RESULT" = success || test "$PORTABILITY_RESULT" = skipped

  deploy:
    name: Deploy website
    needs: gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
