name: Agent Sandbox Image

on:
  pull_request:
    paths:
      - "images/aml-agent-sandbox/**"
      - "sdk/tests/smoke/smoke-config.ts"
      - ".github/workflows/agent-sandbox-image.yml"
  push:
    branches: [main]
    paths:
      - "images/aml-agent-sandbox/**"
      - "sdk/tests/smoke/smoke-config.ts"
      - ".github/workflows/agent-sandbox-image.yml"
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  LOCAL_IMAGE: aml-agent-sandbox:ci

jobs:
  validate:
    name: Build and verify / linux-amd64
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Read image version
        id: version
        run: echo "version=$(node -p "require('./images/aml-agent-sandbox/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: images/aml-agent-sandbox
          load: true
          platforms: linux/amd64
          tags: ${{ env.LOCAL_IMAGE }}
          build-args: |
            IMAGE_VERSION=${{ steps.version.outputs.version }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image contract
        run: docker run --rm --platform linux/amd64 --volume "$PWD/images/aml-agent-sandbox/verify.sh:/verify.sh:ro" "$LOCAL_IMAGE" /verify.sh

      - name: Audit image dependencies
        working-directory: images/aml-agent-sandbox
        run: npm audit --omit=dev
