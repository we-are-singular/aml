services:
  minio:
    image: aml-minio:dev
    build:
      context: .
      dockerfile: scripts/minio.Dockerfile
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_PASSWORD: aml-minio-secret
      MINIO_ROOT_USER: aml-minio
    ports:
      - "19000:9000"
      - "19001:9001"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - aml-minio-data:/data

volumes:
  aml-minio-data:
